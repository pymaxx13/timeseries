[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engressionts"
version = "0.1.0"
description = "Engression-TS: Probabilistic time series forecasting using Engression and Darts"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["engressionts*"]
